[book]
title = "Pandas de Cero a Experto"
authors = ["Nicolás Plata"]
description = "Guía integral de aprendizaje de Python pandas: desde los fundamentos de Python hasta análisis estadístico, machine learning, optimización y dominios especializados."
language = "es"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
mathjax-support = false
no-section-label = false
additional-css = ["theme/custom.css"]

[output.html.search]
enable = true
limit-results = 20
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 2

[output.html.playground]
editable = false
copyable = true
copy-js = true
line-numbers = true

[output.html.fold]
enable = true
level = 1
